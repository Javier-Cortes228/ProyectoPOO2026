<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BanduMusic - Inicio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <h1>🎵 BanduMusic</h1>

    <div class="auth-section">
        <div class="card">
            <h2>Crear Cuenta</h2>
            <input type="text" id="reg-nombre" placeholder="Nombre de usuario" required>
            <input type="email" id="reg-correo" placeholder="Correo electrónico" required>
            <input type="password" id="reg-contrasena" placeholder="Contraseña" required>
            <button onclick="registrarUsuario()">Registrarse</button>
            <p id="reg-mensaje" class="mensaje"></p>
        </div>

        <div class="card">
            <h2>Iniciar Sesión</h2>
            <input type="email" id="login-correo" placeholder="Correo electrónico" required>
            <input type="password" id="login-contrasena" placeholder="Contraseña" required>
            <button onclick="iniciarSesion()">Entrar</button>
            <p id="login-mensaje" class="mensaje"></p>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
