<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BanduMusic - App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="auth-container" class="container">
    <h1>🎵 BanduMusic</h1>
    <div class="auth-section">
        <div class="card">
            <h2>Iniciar Sesión</h2>
            <input type="email" id="login-correo" placeholder="Correo (ej: admin@ufro.cl)">
            <input type="password" id="login-contrasena" placeholder="Contraseña (ej: 1234)">
            <button onclick="iniciarSesion()">Entrar</button>
            <p id="login-error" class="mensaje" style="color: red;"></p>
        </div>
    </div>
</div>

<div id="app-container" class="main-app" style="display: none;">
    <nav class="sidebar">
        <h2 style="color: #1DB954; margin-bottom: 30px;">BanduMusic</h2>
        <ul style="list-style: none; padding: 0; line-height: 2;">
            <li onclick="cargarCatalogo()" style="cursor: pointer;">🏠 Catálogo</li>
        </ul>
    </nav>

    <main class="content">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Explorar</h2>
            <div id="user-info" style="font-weight: bold; color: #1DB954;"></div>
        </header>

        <div id="lista-canciones" class="grid-container">
        </div>
    </main>

    <footer class="player-bar">
        <div class="now-playing" style="width: 200px;">
            <p id="track-title" style="margin: 0; font-weight: bold;">Selecciona una pista</p>
            <small id="track-artist" style="color: gray;"></small>
        </div>

        <div class="controls">
            <button id="play-pause-btn" onclick="togglePlay()">▶</button>
        </div>

        <audio id="audio-player"></audio>
    </footer>
</div>

<script src="js/app.js"></script>
</body>
</html>
