<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BanduMusic - App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="auth-container" class="container">
    <h1>🎵 BanduMusic</h1>
    <div class="auth-section">
        <div class="card">
            <h2>Iniciar Sesión</h2>
            <input type="email" id="login-correo" placeholder="Correo (ej: admin@ufro.cl)">
            <input type="password" id="login-contrasena" placeholder="Contraseña (ej: 1234)">
            <button onclick="iniciarSesion()">Entrar</button>
            <p id="login-error" class="mensaje" style="color: #ff4d4d;"></p>
        </div>
    </div>
</div>

<div id="app-container" class="main-app" style="display: none;">

    <nav class="sidebar">
        <h2 style="color: #1DB954; margin-bottom: 30px;">BanduMusic</h2>
        <ul>
            <li onclick="cargarCatalogo()" class="active">🏠 Inicio</li>
        </ul>

        <div style="margin-top: 30px; border-top: 1px solid #282828; padding-top: 20px;">
            <h4 style="color: white; margin-bottom: 15px;">Tus Playlists</h4>

            <input type="text" id="nombre-nueva-playlist" placeholder="Nueva playlist..." style="width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 4px; border: none; background: #333; color: white; box-sizing: border-box;">

            <button onclick="crearNuevaPlaylist()" style="width: 100%; padding: 8px; background-color: white; color: black; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; transition: transform 0.2s;">
                + Crear
            </button>

            <ul id="lista-mis-playlists" style="margin-top: 20px; list-style: none; padding: 0;">
            </ul>
        </div>
    </nav>

    <main class="content">
        <header class="top-header">
            <input type="text" id="busqueda" class="search-bar" placeholder="¿Qué quieres escuchar?" onkeyup="buscarMusica()">
            <div id="user-info" class="user-badge"></div>
        </header>

        <h3 style="margin-top: 20px;">Catálogo Completo</h3>
        <div id="lista-canciones" class="grid-container">
        </div>
    </main>

    <footer class="player-bar">
        <div class="now-playing">
            <p id="track-title">Selecciona una pista</p>
            <small id="track-artist">...</small>
        </div>

        <div class="controls">
            <button onclick="reproducirAnterior()">⏮</button>
            <button id="play-pause-btn" class="play-btn-main" onclick="togglePlay()">▶</button>
            <button onclick="reproducirSiguiente()">⏭</button>
        </div>

        <audio id="audio-player" onended="reproducirSiguiente()"></audio>
    </footer>
</div>

<script src="js/app.js"></script>
</body>
</html>
