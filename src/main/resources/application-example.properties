spring.application.name=bandumusic
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.web.resources.static-locations=classpath:/static/
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

app.jwt.secret=${JWT_SECRET:bandumusic-dev-secret-change-me-please-2026}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

jamendo.client-id=${JAMENDO_CLIENT_ID:}
jamendo.search.max-results=${JAMENDO_SEARCH_MAX_RESULTS:30}
