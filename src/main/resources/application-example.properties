spring.application.name=bandumusic
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.web.resources.static-locations=classpath:/static/
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

app.jwt.secret=${JWT_SECRET:bandumusic-dev-secret-change-me-please-2026}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

app.frontend.base-url=${FRONTEND_BASE_URL:http://127.0.0.1:5173}
app.email-verification.expiration-minutes=${EMAIL_VERIFICATION_EXPIRATION_MINUTES:10}
app.email-verification.max-attempts=${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
app.email-validation.dns-enabled=${EMAIL_VALIDATION_DNS_ENABLED:true}
app.email-validation.blocked-domains=${EMAIL_VALIDATION_BLOCKED_DOMAINS:example.com,example.org,example.net,test.com,nose.com,mailinator.com,tempmail.com,10minutemail.com}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@bandumusic.local}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:5000}

jamendo.client-id=${JAMENDO_CLIENT_ID:}
jamendo.search.max-results=${JAMENDO_SEARCH_MAX_RESULTS:30}
