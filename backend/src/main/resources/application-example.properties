# ==========================================================
# BanduMusic
# Instrucciones:
# 1. Copia este archivo
# 2. Renómbralo a: application.properties
# 3. Configura las propiedades según tu entorno
# ==========================================================

spring.application.name=bandumusic
server.port=8080

# =========================
# Base de datos
# =========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bandumusic}
spring.datasource.username=${DB_USERNAME:TU_USUARIO}
spring.datasource.password=${DB_PASSWORD:TU_CONTRASEÑA}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# =========================
# Recursos estáticos
# =========================
spring.web.resources.static-locations=classpath:/static/

# =========================
# CORS
# =========================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

# =========================
# JWT
# =========================
app.jwt.secret=${JWT_SECRET:CAMBIA_ESTA_CLAVE_POR_UNA_SEGURA}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# =========================
# Cookies
# =========================
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

# =========================
# Frontend
# =========================
app.frontend.base-url=${FRONTEND_BASE_URL:http://127.0.0.1:5173}

# =========================
# Verificación de correo
# =========================
app.email-verification.expiration-minutes=${EMAIL_VERIFICATION_EXPIRATION_MINUTES:10}
app.email-verification.max-attempts=${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}

# =========================
# Recuperación de contraseña
# =========================
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:10}
app.password-reset.max-attempts=${PASSWORD_RESET_MAX_ATTEMPTS:5}

# =========================
# Validación de email
# =========================
app.email-validation.dns-enabled=${EMAIL_VALIDATION_DNS_ENABLED:true}
app.email-validation.blocked-domains=${EMAIL_VALIDATION_BLOCKED_DOMAINS:example.com,example.org,example.net,test.com,nose.com,mailinator.com,tempmail.com,10minutemail.com}

# =========================
# Correo SMTP
# =========================
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@bandumusic.local}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:5000}

# =========================
# Jamendo API
# =========================
jamendo.client-id=${JAMENDO_CLIENT_ID:}
jamendo.search.max-results=${JAMENDO_SEARCH_MAX_RESULTS:30}