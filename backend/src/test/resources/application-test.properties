spring.application.name=bandumusic-test
server.port=0

spring.datasource.url=jdbc:h2:mem:bandumusic_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

app.cors.allowed-origins=http://127.0.0.1:5173,http://localhost:5173
app.jwt.secret=bandumusic-test-secret-with-more-than-thirty-two-characters
app.jwt.expiration-seconds=3600
app.frontend.base-url=http://127.0.0.1:5173
app.email-verification.expiration-minutes=10
app.email-verification.max-attempts=5
app.password-reset.expiration-minutes=10
app.password-reset.max-attempts=5
app.email-validation.dns-enabled=false
app.email-validation.blocked-domains=example.com,example.org,example.net,test.com,nose.com,mailinator.com,tempmail.com,10minutemail.com
app.mail.enabled=false
app.mail.from=no-reply@bandumusic.test

jamendo.client-id=
jamendo.search.max-results=30
